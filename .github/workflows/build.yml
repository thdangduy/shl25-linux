name: SHL25 Linux 6.16 Cross Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dts/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  kernel-armhf:
    name: Build Linux 6.16 ARMv7 + Sharp AS99 DTB
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout SHL25 project
        uses: actions/checkout@v4
      - name: Install ARMHF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             git make gcc gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf             device-tree-compiler flex bison bc libssl-dev libelf-dev python3 xz-utils
      - name: Build pinned MSM8974 Linux 6.16 kernel and Sharp board DTB
        shell: bash
        run: bash ./scripts/build-linux.sh
      - name: Publish compiled source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shl25-linux616-build
          path: |
            dist/zImage
            dist/qcom-msm8974-sharp-as99.dtb
            dist/qcom-msm8974-sharp-as99.dts
            dist/kernel.config
            dist/SHA256SUMS
            dist/BUILD_INFO.txt
          retention-days: 30
          if-no-files-found: error
