name: SHL25 kernel 3.4 framebuffer and USB diagnostics
on:
  push:
    branches:
      - feat/shl25-k34-hwprobe-20261107
    paths:
      - diagnostics/k34_hwprobe.c
      - diagnostics/k34_fbdiag.c
      - diagnostics/k34_fbtext.c
      - diagnostics/k34_acm_echo.c
      - .github/workflows/k34-hwprobe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARMHF static cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file
      - name: Compile SHL25 framebuffer, input and USB roundtrip diagnostics
        run: |
          mkdir -p dist-k34-probe
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -static -march=armv7-a -mfpu=neon -mfloat-abi=hard -Wall -Wextra -Werror \
            diagnostics/k34_hwprobe.c -o dist-k34-probe/shl25-k34-hwprobe
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -static -march=armv7-a -mfpu=neon -mfloat-abi=hard -Wall -Wextra -Werror \
            diagnostics/k34_fbdiag.c -o dist-k34-probe/shl25-k34-fbdiag
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -static -march=armv7-a -mfpu=neon -mfloat-abi=hard -Wall -Wextra -Werror \
            diagnostics/k34_fbtext.c -o dist-k34-probe/shl25-k34-fbtext
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -static -march=armv7-a -mfpu=neon -mfloat-abi=hard -Wall -Wextra -Werror \
            diagnostics/k34_acm_echo.c -o dist-k34-probe/shl25-k34-acm-echo
          file dist-k34-probe/shl25-k34-*
          (cd dist-k34-probe && sha256sum shl25-k34-hwprobe shl25-k34-fbdiag shl25-k34-fbtext shl25-k34-acm-echo > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: shl25-k34-hwprobe-armhf-static
          path: dist-k34-probe/
          if-no-files-found: error
