name: OPPO A51w TWRP Experimental (ARM32)
on:
  workflow_dispatch:
  push:
    branches:
      - lab/oppo-a51w-twrp
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Release hosted runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache || true
          df -h
      - name: Download and authenticate exact A51w A.17 kernel and QCDT
        run: python3 scripts/prepare_stock_boot.py
      - name: Build with Ubuntu 18.04 / Android 6 legacy toolchain
        run: |
          mkdir -p .omni_ci_data
          docker run --rm --user root \
            -v "$PWD:/workspace/input" \
            -v "$PWD/.omni_ci_data:/workspace/omni" \
            ubuntu:18.04 bash /workspace/input/scripts/build_in_ubuntu18.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oppo-a51w-twrp-experimental-UNFLASHED
          path: |
            dist-a51w/recovery.img
            dist-a51w/A51W_RECOVERY_BUILD_MANIFEST.json
          retention-days: 14
          if-no-files-found: error
